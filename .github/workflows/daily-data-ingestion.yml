name: Scheduled Daily Data Ingestion

"on":
  schedule:
    # Daily at 10:00 AM IST (04:30 AM UTC)
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Force live re-scrape from Groww sources'
        required: true
        type: boolean
        default: true
      smoke_test:
        description: 'Run post-deploy smoke tests against live Space'
        required: false
        type: boolean
        default: false

concurrency:
  group: daily-ingestion
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify-no-manual-index-changes:
    name: Verify No Manual Index Tampering
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Assert data/index/ single-writer policy
        run: |
          AUTHOR=$(git log -1 --format="%ae")
          echo "Last commit author: $AUTHOR"
          if [ "$AUTHOR" != "github-actions[bot]@users.noreply.github.com" ]; then
            CHANGED=$(git diff HEAD~1 HEAD --name-only | grep "^data/index/" || true)
            if [ -n "$CHANGED" ]; then
              echo "ERROR: data/index/ modified in non-bot commit by $AUTHOR:"
              echo "$CHANGED"
              echo "data/index/ is single-writer and must only be committed by github-actions[bot]."
              exit 1
            fi
          fi
          echo "Index integrity verified: No illegal manual modifications."

  ingest:
    name: Scrape, Clean, Chunk & Index
    needs: [verify-no-manual-index-changes]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Install Git LFS
        run: |
          git lfs install

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Cache Hugging Face Transformers
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-minilm-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-hf-minilm-

      - name: Install Dependencies & Headless Browser
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Execute Ingestion Pipeline (Scrape -> Clean -> Chunk -> Embed -> Store)
        run: |
          python -m ingest.run --force

      - name: Verify Ingestion Data Integrity
        run: |
          pytest backend/tests/test_phase1.py -v

      - name: Generate Ingestion Step Summary
        if: always()
        run: |
          if [ -f "data/ingestion_report.json" ]; then
            echo "### 📊 Ingestion Pipeline Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            python -c "
          import json
          with open('data/ingestion_report.json') as f:
              d = json.load(f)
          print(f\"- **Status**: {d.get('status')}\")
          print(f\"- **Timestamp**: {d.get('timestamp')}\")
          print(f\"- **Total Sources**: {d.get('total_sources')}\")
          print(f\"- **Total Chunks**: {d.get('total_chunks')}\")
          print(f\"- **Elapsed Seconds**: {d.get('elapsed_seconds')}s\n\")
          print('| Scheme | Chunks | Date |')
          print('| :--- | :--- | :--- |')
          for s in d.get('schemes', []):
              print(f\"| {s['scheme_name']} | {s['chunks_count']} | {s['doc_date']} |\")
          " >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit & Push Updated Corpus Index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/index/ data/documents/ data/corpus_manifest.yaml data/ingestion_report.json
          if git diff --staged --quiet; then
            echo "No corpus changes detected. Repository is already up to date."
          else
            git commit -m "chore(data): automated daily corpus refresh (10:00 AM IST) [skip ci]"
            git push
          fi

      # Snapshot upload, not `git push`: the Space rejects pushes whose history contains binaries
      # committed outside Xet/LFS. Skipped until the HF_TOKEN repository secret is set.
      # Verified manually on 2026-11-14 (Space commit b39f91b).
      - name: Sync Updated Corpus & Backend to Hugging Face Space
        if: env.HF_TOKEN != ''
        env:
          HF_HUB_DISABLE_XET: "1"  # Xet uploads stalled; classic LFS upload is reliable
        run: |
          git pull --ff-only origin main
          python scripts/deploy_hf_space.py

      - name: Execute Live Space Post-Deploy Smoke Tests
        if: ${{ inputs.smoke_test == true }}
        continue-on-error: true
        run: |
          echo "Waiting 30 seconds for Hugging Face Space container deployment..."
          sleep 30
          python -c "
          import urllib.request, json
          SPACE_URL = 'https://deamonizer-mutual-fund-faq-assistant.hf.space/api/v1/rag/ask'

          test_cases = [
              ('Fact Query', {'query': 'What is the TER of HDFC Top 100 Fund Direct Growth?'}, lambda r: '0.80%' in r.get('rendered', '') or 'ter' in r.get('rendered', '').lower()),
              ('Refusal Query', {'query': 'Should I invest in HDFC Small Cap Fund?'}, lambda r: 'cannot' in r.get('rendered', '').lower() or 'advice' in r.get('rendered', '').lower()),
              ('PII Query', {'query': 'My PAN is ABCPX1234Q — am I invested in HDFC Top 100?'}, lambda r: 'security warning' in r.get('message', '').lower() or 'pii' in str(r).lower()),
          ]

          print('\n=== LIVE SPACE POST-DEPLOY SMOKE TEST ===')
          for name, payload, validator in test_cases:
              try:
                  req = urllib.request.Request(SPACE_URL, data=json.dumps(payload).encode('utf-8'), headers={'Content-Type': 'application/json'})
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      data = json.loads(resp.read().decode('utf-8'))
                      passed = validator(data)
                      print(f'[{'PASS' if passed else 'FAIL'}] {name}: response code 200')
              except urllib.error.HTTPError as e:
                  err_data = json.loads(e.read().decode('utf-8')) if e.code == 400 else {}
                  passed = validator(err_data)
                  print(f'[{'PASS' if passed else 'FAIL'}] {name}: HTTP {e.code}')
              except Exception as e:
                  print(f'[FAIL] {name}: {e}')
          "
